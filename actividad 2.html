
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota</title>
</head>
<body>
    <script>
        const mascota = {
            nombre: "Luna",
            animal: "Perro",
            edad: 4,
            color: "blanco"
        };

        console.log("Nombre: " + mascota.nombre);
        console.log("Edad: " + mascota.edad);

        console.log(
            "Información completa de la mascota:\n" +
            "Nombre: " + mascota.nombre + "\n" +
            "Animal: " + mascota.animal + "\n" +
            "Edad: " + mascota.edad + "\n" +
            "Color: " + mascota.color
        );
    </script>
</body>
</html>
